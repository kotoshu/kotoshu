lang: deberta-pt
script: latin
segmentation: whitespace
prompt_lang: pt
encoder: microsoft/deberta-v3-base
bf16: true
keep: 0.3
flavor: a10g-large
base:
  source: wikisource
  config: latest-dump
  prune_corpus: base_pt.txt
rate: 0.8
ckpt_repo: kotoshu/gec-ckpt-pt-deberta
tokenizer: microsoft/deberta-v3-base
quantize: false
charsmap: charsmap_deberta.json

eval:
  slices:
    - pt_heldout_eval_sources.txt

# Release workflow using RubyGems trusted publishing (OIDC).
#
# Does NOT use the relaton/support reusable workflow — that workflow
# requires rubygems-api-key as a declared secret, which prevents
# trusted publishing from working when the secret isn't configured.
# This standalone version uses the
# rubygems/configure-rubygems-credentials action directly for OIDC.
#
# Does NOT use `gem bump` (provided by the `gemman` gem) — that
# command isn't available in a stock rubygems install. Version
# bumping is done inline via sed + git.
name: release

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch (or pre|rc|etc).
          Also, you can pass 'skip' to skip 'git tag' and do 'gem push' for the current version
        required: true
        default: 'skip'
  repository_dispatch:
    types: [do-release]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Configure RubyGems credentials (trusted publishing via OIDC)
        uses: rubygems/configure-rubygems-credentials@v1.0.0
        with:
          trusted-publisher: true

      - name: Determine version
        id: version
        run: |
          CURRENT=$(ruby -e "require './lib/kotoshu/version'; puts Kotoshu::VERSION")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          NEXT_INPUT="${{ github.event.inputs.next_version }}"
          if [ "$NEXT_INPUT" = "skip" ]; then
            echo "next=$CURRENT" >> $GITHUB_OUTPUT
            echo "skip_bump=true" >> $GITHUB_OUTPUT
          elif echo "$NEXT_INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "next=$NEXT_INPUT" >> $GITHUB_OUTPUT
            echo "skip_bump=false" >> $GITHUB_OUTPUT
          else
            # Semantic-bump shorthand (major/minor/patch) — compute the
            # next version from CURRENT without depending on `gem bump`.
            BUMPED=$(ruby -e "
              current = '${CURRENT}'.split('.').map(&:to_i)
              case '${NEXT_INPUT}'
              when 'major' then current[0] += 1; current[1] = 0; current[2] = 0
              when 'minor' then current[1] += 1; current[2] = 0
              when 'patch' then current[2] += 1
              else abort \"unsupported bump: ${NEXT_INPUT}\"
              end
              print current.join('.')
            ")
            echo "next=$BUMPED" >> $GITHUB_OUTPUT
            echo "skip_bump=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version, commit, tag, push
        if: steps.version.outputs.skip_bump != 'true'
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          # Rewrite lib/kotoshu/version.rb in place.
          sed -i -E "s/VERSION = '[0-9.]+'/VERSION = '${NEXT}'/" lib/kotoshu/version.rb
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add lib/kotoshu/version.rb
          git commit -m "chore: bump VERSION to ${NEXT} for release"
          git tag "v${NEXT}"
          git push origin "${{ github.ref_name }}"
          git push origin "v${NEXT}"

      - name: Build gem
        run: gem build kotoshu.gemspec

      - name: Push gem (trusted publishing)
        run: gem push kotoshu-*.gem

  # Precompiled native platform gems (plan 133): every leg builds
  # natively on its own runner, assembles the platform gem with
  # scripts/build_native_gem.rb, and pushes it through the SAME
  # workflow's trusted publishing (per-leg pushes are individually
  # re-runnable). `gem install kotoshu` then resolves the Rust engine
  # on platforms that have a gem; the pure-Ruby gem serves everywhere
  # else and is always published alongside.
  native:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runs-on: ubuntu-latest
            toolchain: stable
          - platform: aarch64-linux
            runs-on: ubuntu-24.04-arm
            toolchain: stable
          - platform: arm64-darwin
            runs-on: macos-14
            toolchain: stable
          - platform: x86_64-darwin
            runs-on: macos-13
            toolchain: stable
          # RubyInstaller Ruby is MinGW-ABI; the rustup Windows default
          # (msvc) cannot bind to its headers. Use the GNU-host toolchain
          # so cargo compiles for the ABI the local Ruby was built with.
          - platform: x64-mingw-ucrt
            runs-on: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Configure RubyGems credentials (trusted publishing via OIDC)
        uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Compile the extension (release)
        run: bundle exec rake compile:release

      - name: Assemble and push the platform gem
        shell: bash
        run: |
          ruby scripts/build_native_gem.rb
          gem push kotoshu-*-${{ matrix.platform }}.gem

name: native-gems

# Plan 133: build the precompiled native platform gems so `gem install
# kotoshu` resolves the Rust engine with no toolchain on the platforms
# that have one. The same matrix publishes on release (release.yml's
# native job reuses these build steps); this workflow runs the BUILD
# only, on every PR that touches the extension or the build wiring.
on:
  pull_request:
    paths:
      - "ext/kotoshu_native/**"
      - "Rakefile"
      - "Gemfile"
      - ".github/workflows/native-gems.yml"
      - "kotoshu.gemspec"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runs-on: ubuntu-latest
            docker: true
          - platform: aarch64-linux
            runs-on: ubuntu-latest
            docker: true
          - platform: arm64-darwin
            runs-on: macos-14
          - platform: x86_64-darwin
            runs-on: macos-14
            cross-from: arm64-darwin
          - platform: x64-mingw-ucrt
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build the platform gem (Linux cross via rb-sys docker)
        if: matrix.docker
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e RUBY_TARGET=${{ matrix.platform }} \
            -e BUILD_NATIVE_GEM=1 \
            ghcr.io/rbsys/${{ matrix.platform }}:latest \
            bash -c "gem install rb_sys rake-compiler && bundle install --without development && rake nativegem"

      - name: Build the platform gem (native runners)
        if: ${{ !matrix.docker }}
        shell: bash
        run: |
          if [ -n "${{ matrix.cross-from }}" ]; then
            rustup target add $(ruby -e 'require "rb_sys/toolchain_info"; print RbSys::ToolchainInfo.new(ENV.fetch("RUBY_TARGET")).rust_target' 2>/dev/null || true)
          fi
          RUBY_TARGET=${{ matrix.platform }} BUILD_NATIVE_GEM=1 bundle exec rake nativegem

      - name: The platform gem exists
        shell: bash
        run: ls -la kotoshu-*-${{ matrix.platform }}.gem

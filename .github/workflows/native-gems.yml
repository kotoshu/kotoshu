name: native-gems

# Plan 133: build the precompiled native platform gems so `gem install
# kotoshu` resolves the Rust engine with no toolchain on the platforms
# that have one. Every leg builds NATIVELY on its own runner (no cross
# toolchains): compile the extension in release mode, then assemble
# the platform gem with scripts/build_native_gem.rb — the same
# surgery rb_sys's cross blocks perform, verified end to end on
# arm64-darwin (installs toolchain-free, native engine engages under
# the auto default, frozen conformance vectors replay green).
#
# The release workflow runs this same matrix with a push step.
on:
  pull_request:
    paths:
      - "ext/kotoshu_native/**"
      - "scripts/build_native_gem.rb"
      - "Gemfile"
      - ".github/workflows/native-gems.yml"
      - "kotoshu.gemspec"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runs-on: ubuntu-latest
          - platform: aarch64-linux
            runs-on: ubuntu-24.04-arm
          - platform: arm64-darwin
            runs-on: macos-14
          - platform: x86_64-darwin
            runs-on: macos-13
          - platform: x64-mingw-ucrt
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Compile the extension (release)
        run: bundle exec rake compile:release

      - name: Assemble the platform gem
        run: ruby scripts/build_native_gem.rb

      - name: The platform gem exists and carries the binary
        shell: bash
        run: |
          ls -la kotoshu-*-${{ matrix.platform }}.gem
          gem contents --local kotoshu 2>/dev/null || true
          tar tf kotoshu-*-${{ matrix.platform }}.gem | grep -q data.tar.gz

      - name: Install the gem and prove the native engine engages
        shell: bash
        run: |
          GEM_HOME="$RUNNER_TEMP/gemhome" gem install kotoshu-*-${{ matrix.platform }}.gem --no-document
          GEM_HOME="$RUNNER_TEMP/gemhome" ruby -e '
            require "kotoshu"
            abort "native extension did not load" unless Kotoshu::Native.available?
            abort "backend default is not auto" unless Kotoshu::Configuration::DEFAULTS[:backend] == "auto"
            puts "native engine: OK (auto default)"
          '

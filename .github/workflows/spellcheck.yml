name: spellcheck

on:
  push:
    branches: [main]
  pull_request:

# The SARIF upload to code scanning needs the explicit write grant:
# push-event tokens were refused ("Resource not accessible by
# integration") without it, failing main's spellcheck since 2026-09-12
# while pull-request runs uploaded fine.
permissions:
  contents: read
  security-events: write

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kotoshu/action-kotoshu@v2
        with:
          # Prose only: the language resources under lib/ are
          # word-list data for other languages, and the spec
          # fixtures carry intentional misspellings.
          files: "CHANGELOG.md CODE_OF_CONDUCT.md SECURITY.md docs"
          language: en
          baseline: .kotoshu-baseline.json
          format: sarif

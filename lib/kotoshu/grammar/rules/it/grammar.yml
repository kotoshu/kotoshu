# Italian starter rules — original orthography rules only (no third-
# party rule data). Every bad form is unambiguously wrong in any era of
# the language (apostrophe elision errors, che-word accent errors, the
# sopratutto misspelling) and near-zero in clean Italian prose; the
# pre-reform forms (po'/pò, nè, sè) are deliberately EXCLUDED — they
# occur legitimately in historical text, so flagging them would fire on
# clean text (FP-budget law).
- id: IT_UN_ALTRO
  category: grammar
  language: it
  matcher: word_list
  pattern:
    case_sensitive: false
    words: ["un'altro"]
  message: "'un altro' non richiede l'apostrofo (altro non inizia per vocale)"
  suggestions:
    - replace: { word: "un'altro", with: "un altro" }
  examples:
    - bad: "Voglio un'altro caffè."
      good: "Voglio un altro caffè."

- id: IT_QUAL_E
  category: apostrophes
  language: it
  matcher: word_list
  pattern:
    case_sensitive: false
    words: ["qual'è"]
  message: "'qual è' non richiede l'apostrofo (qual è invariato davanti a vocale)"
  suggestions:
    - replace: { word: "qual'è", with: "qual è" }
  examples:
    - bad: "Qual'è il tuo nome?"
      good: "Qual è il tuo nome?"

- id: IT_QUAL_ERA
  category: apostrophes
  language: it
  matcher: word_list
  pattern:
    case_sensitive: false
    words: ["qual'era"]
  message: "'qual era' — l'apostrofo con qual è sbagliato davanti a 'era'"
  suggestions:
    - replace: { word: "qual'era", with: "qual era" }
  examples:
    - bad: "Qual'era la domanda?"
      good: "Qual era la domanda?"


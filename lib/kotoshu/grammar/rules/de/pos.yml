# German POS-keyed rules (issue #289). Keyed on the UD universal tagset
# through a de POS tagger — the wiring follows the ur precedent and is not
# landed yet, so rules here carry `examples: []` until a tagger can fire
# them in CI. FP-budget law: rules that fire on clean text are rejected.

    - besser wie
    - größer wie
    - kleiner wie
    - mehr wie
    - schlechter wie
    - schneller wie
    - höher wie
    - tiefer wie
  message: Vergleich mit 'als', nicht 'wie'
  suggestions:
  - replace:
      word: wie
      with: als
  examples:
  - bad: Das ist besser wie vorher.
    good: Das ist besser als vorher.

# Orthography extension — wieder/wider compounds and hypercorrections.
# Every bad form is unambiguously wrong in modern German prose (the
# split forms "wieder sprechen" etc. are the only legitimate readings,
# and they never occur written as one word), so flagging cannot fire on
# clean text (FP-budget law). Pre-reform ß forms are deliberately
# excluded — Swiss orthography uses ss legitimately.
- id: DE_WIEDERSPIEGELN
  category: spelling
  language: de
  matcher: word_list
  pattern:
    case_sensitive: false
    words: ["wiederspiegeln", "wiederspiegelt", "wiederspiegelte"]
  message: "Richtig: 'widerspiegeln' (wider-, nicht wieder-)"
  suggestions:
    - replace: { word: wiederspiegeln, with: widerspiegeln }
  examples:
    - bad: "Die Zahlen wiederspiegeln den Trend."
      good: "Die Zahlen widerspiegeln den Trend."


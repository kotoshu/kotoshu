- id: DE_SEIT_SEID_TIME
  category: confusion
  language: de
  matcher: word_list
  pattern:
    case_sensitive: false
    words:
    - seid dem
    - seid Jahren
    - seid gestern
    - seid heute
    - seid Anfang
  message: Zeitliches 'seit' ohne d (seit dem, seit Jahren)
  suggestions:
  - replace:
      word: seid
      with: seit
  examples:
  - bad: Ich warte seid dem Morgen.
    good: Ich warte seit dem Morgen.
- id: DE_SEID_SEIT_IHR
  category: confusion
  language: de
  matcher: word_list
  pattern:
    case_sensitive: false
    words:
    - seit ihr
    - seit Sie
  message: Verbform 'seid' (ihr seid), nicht 'seit'
  suggestions:
  - replace:
      word: seit
      with: seid
  examples:
  - bad: Wo seit ihr gewesen?
    good: Wo seid ihr gewesen?
- id: DE_BESSER_WIE

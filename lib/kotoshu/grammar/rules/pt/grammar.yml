# Portuguese starter rules — original orthography rules only (no
# third-party rule data). Unaccented forms listed here are never valid
# Portuguese words, and the misspellings (excessão, previlégio,
# mendingo, adevogado, beneficiente, agrassivo) never occur in clean
# prose. The legally ambiguous pairs (esta/está, por que/porque) are
# deliberately EXCLUDED — they need part-of-speech context (FP-budget
# law). One rule per exact replacement pair.
- id: PT_VOCE
  category: accents
  language: pt
  matcher: word_list
  pattern:
    case_sensitive: false
    words: ["voce", "voces"]
  message: "Acentuação: 'você', 'vocês'"
  suggestions:
    - replace: { word: voce, with: você }
    - replace: { word: voces, with: vocês }
  examples:
    - bad: "Voce vai comparecer?"
      good: "Você vai comparecer?"


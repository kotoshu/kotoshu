# Dutch starter rules — original orthography rules only (no third-
# party rule data). Every bad form is unambiguously wrong in modern
# Dutch prose (misspellings that never occur as valid spellings, or
# one-letter-and-double-letter confusions where only one spelling
# exists). FP-budget law: nothing here can fire on clean text.
- id: NL_MISCHIEN
  category: spelling
  language: nl
  matcher: word_list
  pattern:
    case_sensitive: false
    words: ["mischien"]
  message: "Juiste spelling: 'misschien' (dubbele s)"
  suggestions:
    - replace: { word: mischien, with: misschien }
  examples:
    - bad: "Mischien komt hij morgen."
      good: "Misschien komt hij morgen."


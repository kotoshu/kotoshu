# Polish starter rules — original orthography rules only (no third-
# party rule data). Every bad form is unambiguously wrong in modern
# Polish: the listed missing-ogonek forms are never valid spellings,
# napewno/narazie never occur as single words, and native words never
# double the l. One rule per replacement pair (the matcher swaps the
# listed word verbatim). FP-budget law: nothing here can fire on
# clean text.
- id: PL_NAPEWNO
  category: spelling
  language: pl
  matcher: word_list
  pattern:
    case_sensitive: false
    words: ["napewno"]
  message: "Rozdzielnie: 'na pewno'"
  suggestions:
    - replace_span: { with: "na pewno" }
  examples:
    - bad: "Napewno przyjdzie."
      good: "Na pewno przyjdzie."


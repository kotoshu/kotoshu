# Greek starter rules — original orthography rules only. Unaccented
# function words are never valid Greek orthography; the forms listed
# here always carry an accent in clean text. Legally ambiguous pairs
# (οτι/ό,τι, ποιοι, τα) are excluded — they need context. FP-budget
# law: nothing here can fire on clean Greek text.
- id: EL_EINAI
  category: accents
  language: el
  matcher: word_list
  pattern:
    case_sensitive: false
    words: ["ειναι"]
  message: "Τόνωση: 'είναι'"
  suggestions:
    - replace: { word: ειναι, with: είναι }
  examples:
    - bad: "Αυτο ειναι σωστο."
      good: "Αυτό είναι σωστό."


# Turkish starter rules — original orthography rules only. Every bad
# form is unambiguously wrong in modern Turkish: the şey compounds are
# always written separately, yanlış/yalnız need ı/a respectively, the
# colloquial future forms (olucak, gelicek) never occur in standard
# orthography, and Turkce lacks the umlaut. FP-budget law: nothing
# here can fire on clean Turkish text.
- id: TR_HERSEY
  category: spelling
  language: tr
  matcher: word_list
  pattern:
    case_sensitive: false
    words: ["herşey", "herşeyi", "herşeyin"]
  message: "Ayrı yazılır: 'her şey'"
  suggestions:
    - replace: { word: herşey, with: "her şey" }
    - replace: { word: herşeyi, with: "her şeyi" }
    - replace: { word: herşeyin, with: "her şeyin" }
  examples:
    - bad: "Herşey yolunda."
      good: "Her şey yolunda."


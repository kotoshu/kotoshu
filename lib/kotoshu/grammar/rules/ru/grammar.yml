# Russian starter rules — original orthography rules only. Every bad
# form is unambiguously wrong in standard Russian prose. The тся/ться
# and так же/также pairs are deliberately EXCLUDED — they need
# part-of-speech context (FP-budget law). One rule per exact
# replacement pair.
- id: RU_VOOBSHCHEM
  category: spelling
  language: ru
  matcher: word_list
  pattern:
    case_sensitive: false
    words: ["вообщем"]
  message: "Раздельно: «в общем»"
  suggestions:
    - replace_span: { with: "в общем" }
  examples:
    - bad: "Вообщем всё ясно."
      good: "В общем всё ясно."

- id: RU_IHNIY
  category: spelling
  language: ru
  matcher: word_list
  pattern:
    case_sensitive: false
    words: ["ихний", "ихняя", "ихнее"]
  message: "Правильно: «их»"
  suggestions:
    - replace: { word: ихний, with: их }
    - replace: { word: ихняя, with: их }
    - replace: { word: ихнее, with: их }
  examples:
    - bad: "Это ихний дом."
      good: "Это их дом."

